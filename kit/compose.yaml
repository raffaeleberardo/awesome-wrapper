# Git Wrapped, kit pronto: scarica le immagini già costruite, niente codice e niente build.
# Uso: vedi LEGGIMI.txt. Le variabili si leggono dal file .env in questa cartella.
name: git-wrapped

x-logging: &logging
  driver: json-file
  options:
    max-size: '1m'
    max-file: '3'

services:
  api:
    image: ghcr.io/raffaeleberardo/git-wrapped-api:latest
    environment:
      # Senza .env parte la demo con dati inventati.
      DEMO_MODE: ${DEMO_MODE:-true}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_GROUP: ${GITLAB_GROUP:-}
      WRAPPED_YEAR: ${WRAPPED_YEAR:-2026}
      TZ: ${TZ:-Europe/Rome}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-15}
      GITLAB_CA_CERT: ${GITLAB_CA_CERT:-}
    # Porta 3000 solo sulla rete interna: nessun "ports".
    expose: ['3000']
    read_only: true
    tmpfs: [/tmp]
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    image: ghcr.io/raffaeleberardo/git-wrapped-web:latest
    # Solo da questo computer: chi è sulla stessa rete (es. Wi-Fi dell'ufficio) non la vede.
    ports: ['127.0.0.1:8080:8080']
    read_only: true
    tmpfs: [/tmp]
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
