stages: [lint, test, build]

default:
  image: node:22-alpine
  interruptible: true

variables:
  PNPM_HOME: /pnpm
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store
  # Deve coincidere con la versione di @playwright/test nel lockfile (e con docker/test.Dockerfile).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble

# Cache dello store pnpm, chiave legata al lockfile.
.pnpm:
  before_script:
    - corepack enable
    - export PATH="$PNPM_HOME:$PATH"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

lint:
  extends: .pnpm
  stage: lint
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm typecheck

test:
  extends: .pnpm
  stage: test
  script:
    - pnpm test

# End-to-end sulle rotte di sviluppo del modulo (dev server Vite avviato da Playwright).
e2e:
  extends: .pnpm
  stage: test
  image: $PLAYWRIGHT_IMAGE
  script:
    - pnpm e2e
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths: [test-results/, playwright-report/]

# Build delle immagini con docker:dind: e' il metodo piu' semplice e compatibile con i Dockerfile
# (BuildKit, cache mount). Kaniko e' stato archiviato da Google; buildah richiederebbe un runner
# configurato ad hoc. Costo: runner con `privileged = true`. Nessun push: solo verifica la build.
build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_BUILDKIT: '1'
  script:
    - docker build -f docker/api.Dockerfile -t git-wrapped-api:$CI_COMMIT_SHORT_SHA .
    - docker build -f docker/web.Dockerfile -t git-wrapped-web:$CI_COMMIT_SHORT_SHA .
    - docker image ls git-wrapped-api git-wrapped-web
